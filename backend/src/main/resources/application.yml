spring:
  application:
    name: holink
  datasource:
    url: jdbc:h2:mem:holinkdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

auth:
  jwt:
    secret: local-development-jwt-secret-change-me-1234567890
    expiration-minutes: 1440
