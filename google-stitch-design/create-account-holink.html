<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>HoLink - Create Account</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "inverse-on-surface": "#eaf1ff",
                    "surface-container-highest": "#d3e4fe",
                    "tertiary-container": "#757571",
                    "primary-fixed": "#ffdbcc",
                    "on-secondary-container": "#5f656c",
                    "surface": "#f8f9ff",
                    "surface-container-low": "#eff4ff",
                    "secondary": "#595f66",
                    "surface-container": "#e5eeff",
                    "on-secondary-fixed-variant": "#41474e",
                    "primary-fixed-dim": "#ffb693",
                    "surface-dim": "#cbdbf5",
                    "primary-container": "#c45100",
                    "on-tertiary-container": "#fefcf7",
                    "outline-variant": "#e0c0b2",
                    "inverse-primary": "#ffb693",
                    "on-surface-variant": "#584238",
                    "on-secondary-fixed": "#161c22",
                    "on-primary-fixed": "#351000",
                    "background": "#f8f9ff",
                    "tertiary-fixed": "#e4e2dd",
                    "on-primary": "#ffffff",
                    "on-primary-container": "#fffbff",
                    "on-surface": "#0b1c30",
                    "tertiary": "#5c5c58",
                    "on-primary-fixed-variant": "#7a3000",
                    "on-background": "#0b1c30",
                    "surface-container-high": "#dce9ff",
                    "outline": "#8c7166",
                    "on-error": "#ffffff",
                    "on-tertiary": "#ffffff",
                    "error-container": "#ffdad6",
                    "on-secondary": "#ffffff",
                    "on-tertiary-fixed": "#1b1c19",
                    "secondary-container": "#dde3eb",
                    "error": "#ba1a1a",
                    "tertiary-fixed-dim": "#c8c6c2",
                    "surface-bright": "#f8f9ff",
                    "inverse-surface": "#213145",
                    "surface-variant": "#d3e4fe",
                    "surface-tint": "#a04100",
                    "on-error-container": "#93000a",
                    "primary": "#9c3f00",
                    "secondary-fixed": "#dde3eb",
                    "secondary-fixed-dim": "#c1c7cf",
                    "surface-container-lowest": "#ffffff",
                    "on-tertiary-fixed-variant": "#474744"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px",
                    "2xl": "1.5rem"
            },
            "spacing": {
                    "xs": "8px",
                    "margin-mobile": "16px",
                    "margin-desktop": "48px",
                    "md": "24px",
                    "base": "4px",
                    "xl": "64px",
                    "gutter": "20px",
                    "lg": "40px",
                    "sm": "16px"
            },
            "fontFamily": {
                    "headline-lg-mobile": ["Hanken Grotesk"],
                    "label-md": ["Inter"],
                    "body-md": ["Inter"],
                    "display": ["Hanken Grotesk"],
                    "headline-md": ["Hanken Grotesk"],
                    "headline-lg": ["Hanken Grotesk"],
                    "label-sm": ["Inter"],
                    "body-lg": ["Inter"]
            },
            "fontSize": {
                    "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "display": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "600"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}]
            }
          }
        }
      }
    </script>
<style>
        body {
            background-color: #F9F7F2; /* Cream background level 0 */
        }
        .bento-card {
            background-color: #FFFFFF;
            border: 1px solid #E2E2E2;
            border-radius: 1.5rem; /* 24px */
        }
        .bento-card:hover {
            box-shadow: 0px 4px 20px rgba(0,0,0,0.04);
        }
        .input-minimal {
            border: 1px solid #E2E2E2;
            border-radius: 0.5rem;
            transition: all 0.2s ease;
        }
        .input-minimal:focus {
            border-color: #c45100;
            box-shadow: 0 0 0 2px rgba(196, 81, 0, 0.1);
            outline: none;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop font-body-md text-on-surface">
<main class="w-full max-w-[480px]">
<div class="bento-card p-md md:p-lg flex flex-col gap-lg">
<!-- Header -->
<header class="text-center flex flex-col items-center gap-sm">
<h1 class="font-headline-lg text-headline-lg text-primary">HoLink</h1>
<div>
<h2 class="font-headline-md text-headline-md text-on-surface">Create your HoLink account</h2>
<p class="font-body-md text-body-md text-secondary mt-xs">Join the platform for modern digital creators.</p>
</div>
</header>
<!-- Form -->
<form action="#" class="flex flex-col gap-md" method="POST">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="name">Full Name</label>
<input class="input-minimal w-full px-4 py-3 font-body-md text-body-md bg-surface-container-lowest text-on-surface placeholder:text-secondary-fixed-dim" id="name" name="name" placeholder="Jane Doe" required="" type="text"/>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="email">Email Address</label>
<input class="input-minimal w-full px-4 py-3 font-body-md text-body-md bg-surface-container-lowest text-on-surface placeholder:text-secondary-fixed-dim" id="email" name="email" placeholder="jane@example.com" required="" type="email"/>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<input class="input-minimal w-full px-4 py-3 font-body-md text-body-md bg-surface-container-lowest text-on-surface placeholder:text-secondary-fixed-dim" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="confirm_password">Confirm Password</label>
<input class="input-minimal w-full px-4 py-3 font-body-md text-body-md bg-surface-container-lowest text-on-surface placeholder:text-secondary-fixed-dim" id="confirm_password" name="confirm_password" placeholder="••••••••" required="" type="password"/>
</div>
<button class="w-full bg-primary-container text-on-primary-container font-label-md text-label-md py-4 rounded-lg hover:opacity-90 transition-opacity mt-sm font-semibold" type="submit">
                    Create Account
                </button>
</form>
<!-- Footer -->
<footer class="text-center mt-sm border-t border-outline-variant pt-md">
<p class="font-body-md text-body-md text-secondary">
                    Already have an account? 
                    <a class="text-primary hover:text-primary-fixed-dim font-label-md text-label-md transition-colors" href="/login">Login</a>
</p>
</footer>
</div>
</main>
</body></html>
